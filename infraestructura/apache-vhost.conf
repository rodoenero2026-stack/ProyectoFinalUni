# ============================================================================
# CONFIGURACIÓN DE SERVIDOR WEB APACHE (VM en Red Intermedia OPNsense)
# Habilitar módulos: a2enmod proxy proxy_http headers rewrite
# ============================================================================
<VirtualHost *:80>
    ServerName servidor-seguridad.local
    ServerAdmin admin@uni.edu.mx

    # Cabeceras de Seguridad HTTP
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # Reverse Proxy hacia la aplicación Node.js (Puerto 3000)
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/seguridad_rbac_error.log
    CustomLog ${APACHE_LOG_DIR}/seguridad_rbac_access.log combined
</VirtualHost>
